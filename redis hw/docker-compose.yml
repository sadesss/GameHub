services:
  redis-master:
    image: redis:7.4-alpine
    container_name: redis-master
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis/master.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-master-data:/data
    networks:
      - gamehub-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis-replica-1:
    image: redis:7.4-alpine
    container_name: redis-replica-1
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6380:6379"
    volumes:
      - ./redis/replica.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - gamehub-network
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis-replica-2:
    image: redis:7.4-alpine
    container_name: redis-replica-2
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6381:6379"
    volumes:
      - ./redis/replica.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - gamehub-network
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  sentinel-1:
    image: redis:7.4-alpine
    container_name: sentinel-1
    command: ["redis-sentinel", "/etc/redis/sentinel.conf"]
    ports:
      - "26379:26379"
    volumes:
      - ./redis/sentinel-1:/etc/redis
    networks:
      - gamehub-network
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  sentinel-2:
    image: redis:7.4-alpine
    container_name: sentinel-2
    command: ["redis-sentinel", "/etc/redis/sentinel.conf"]
    ports:
      - "26380:26379"
    volumes:
      - ./redis/sentinel-2:/etc/redis
    networks:
      - gamehub-network
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  sentinel-3:
    image: redis:7.4-alpine
    container_name: sentinel-3
    command: ["redis-sentinel", "/etc/redis/sentinel.conf"]
    ports:
      - "26381:26379"
    volumes:
      - ./redis/sentinel-3:/etc/redis
    networks:
      - gamehub-network
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  gamehub-app:
    build: .
    container_name: gamehub-app
    ports:
      - "8080:8080"
    environment:
      REDIS_MODE: sentinel
      REDIS_SENTINEL_MASTER: mymaster
      REDIS_SENTINEL_NODES: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
    networks:
      - gamehub-network
    depends_on:
      sentinel-1:
        condition: service_healthy
      sentinel-2:
        condition: service_healthy
      sentinel-3:
        condition: service_healthy
    restart: unless-stopped

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "5540:5540"
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    networks:
      - gamehub-network
    restart: unless-stopped

networks:
  gamehub-network:
    driver: bridge

volumes:
  redis-master-data: